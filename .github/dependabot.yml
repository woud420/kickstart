# Weekly dependency updates for kickstart's own tooling.
#
# Versions pinned inside src/templates/**/*.tpl are not package manifests, so
# Dependabot cannot see them; bump scaffold toolchain pins by hand.
version: 2
updates:
  # Poetry project: pyproject.toml and poetry.lock.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-minor-and-patch:
        update-types: [minor, patch]

  # "/" covers .github/workflows; composite actions need their own entries.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
