name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  PYTHON_VERSION: "3.14"
  POETRY_VERSION: "2.3.3"

jobs:
  verify:
    name: Verify Release Inputs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Release tags must point to commits already merged to master."
            exit 1
          fi

      # `make release-check` only uses the stdlib (tomllib), so we set up Python
      # before Poetry — the release-check policy can run without the venv.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify release version
        run: make release-check TAG="$GITHUB_REF_NAME"

      - name: Verify public telemetry build token
        env:
          POSTHOG_PUBLIC_CUSTOMER_API_TOKEN: ${{ secrets.POSTHOG_PUBLIC_CUSTOMER_API_TOKEN }}
        run: python3 scripts/embed_posthog_token.py --check

      - name: Set up Python + Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run checks
        run: make check

      # The website version-sync test (content.ts <-> pyproject.toml) must
      # gate the release BEFORE anything publishes; the website job below
      # runs after the GitHub Release exists, which is too late to stop a
      # desynced changelog from shipping.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Check website (version sync gate)
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run check

  # No PyPI publish on purpose: the PyPI name "kickstart" belongs to an
  # unrelated, abandoned 2011 project, so a publish step could only fail
  # or mislead. The wheel/sdist attach to the GitHub Release instead. If
  # the project ever gets a PyPI identity (rename or PEP 541 transfer),
  # reintroduce publishing as a fail-loud step, not a skip-on-missing-token.
  package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python + Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Stage public telemetry build configuration
        env:
          POSTHOG_PUBLIC_CUSTOMER_API_TOKEN: ${{ secrets.POSTHOG_PUBLIC_CUSTOMER_API_TOKEN }}
        run: python3 scripts/embed_posthog_token.py --write

      - name: Build package
        run: make package

      - name: Verify package telemetry configuration
        env:
          POSTHOG_PUBLIC_CUSTOMER_API_TOKEN: ${{ secrets.POSTHOG_PUBLIC_CUSTOMER_API_TOKEN }}
        run: >-
          poetry run python scripts/verify_embedded_telemetry_artifact.py
          --expected-token-env POSTHOG_PUBLIC_CUSTOMER_API_TOKEN
          dist/*.whl dist/*.tar.gz

      - name: Clear staged public telemetry build configuration
        if: ${{ always() }}
        run: python3 scripts/embed_posthog_token.py --clear

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 7

  binary:
    name: Build ${{ matrix.platform }} Python ${{ matrix.python-version }} Binary
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            python-version: "3.14"
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            python-version: "3.14"
          - runner: macos-15
            platform: macos-arm64
            python-version: "3.14"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python + Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Stage public telemetry build configuration
        env:
          POSTHOG_PUBLIC_CUSTOMER_API_TOKEN: ${{ secrets.POSTHOG_PUBLIC_CUSTOMER_API_TOKEN }}
        run: python3 scripts/embed_posthog_token.py --write

      - name: Build kickstart binary
        run: make binary

      - name: Name, smoke-test, and archive binary
        env:
          EXPECT_EMBEDDED_TELEMETRY: "1"
          PLATFORM: ${{ matrix.platform }}
          PYTHON_MINOR: ${{ matrix.python-version }}
        run: scripts/ci/name-and-smoke-binary.sh "${PLATFORM}" "${PYTHON_MINOR}"

      - name: Clear staged public telemetry build configuration
        if: ${{ always() }}
        run: python3 scripts/embed_posthog_token.py --clear

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: |
            dist/kickstart-*.tar.gz
            dist/kickstart-*.tar.gz.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package, binary]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: artifacts/python-package

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts/binaries
          merge-multiple: true

      - name: Stage install script
        run: |
          mkdir -p artifacts/scripts
          install -m 0755 scripts/install.sh artifacts/scripts/install.sh

      # The release page leads with the version's CHANGELOG summary and a short
      # install note; GitHub appends the generated list of merged PRs.
      - name: Render release notes
        run: python3 ci/release_notes.py --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --output artifacts/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          append_body: false
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          files: |
            artifacts/python-package/*.whl
            artifacts/python-package/*.tar.gz
            artifacts/binaries/kickstart-*
            artifacts/scripts/install.sh
          body_path: artifacts/release-body.md

  homebrew:
    name: Update Homebrew Tap
    needs: release
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  website:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: release
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install website dependencies
        run: bun install --frozen-lockfile

      - name: Check website
        run: bun run check

      - name: Check website deploy credentials
        id: website-deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEBSITE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REPOSITORY" = "woud420/kickstart" ]; then
            # On the canonical repo a missing credential means the public
            # site silently stops tracking releases — fail instead of
            # green-skipping (the pattern that stranded v0.4.3 untagged).
            echo "::error::Cloudflare website credentials are not configured; the release website deploy cannot run. Configure the CLOUDFLARE_ACCOUNT_ID variable and CLOUDFLARE_WEBSITE_API_TOKEN secret."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare website credentials are not configured; skipping website deploy (fork)."
          fi

      - name: Deploy website with Alchemy
        if: ${{ steps.website-deploy.outputs.ready == 'true' }}
        env:
          ALCHEMY_TELEMETRY_DISABLED: "1"
          # Alchemy v2 keeps state in a local file. The runner starts empty, so
          # `deploy:release` passes --adopt and every deploy takes over the
          # existing Worker and custom domains by name instead of creating new
          # ones; ephemeral state cannot orphan infrastructure.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEBSITE_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run deploy:release
