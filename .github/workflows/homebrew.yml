name: Homebrew Distribution

on:
  pull_request:
    paths:
      - ci/homebrew.py
      - scripts/ci/smoke-homebrew.sh
      - .github/workflows/homebrew.yml
      - .github/workflows/release.yml
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to distribute (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-distribution
  cancel-in-progress: false

jobs:
  formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify published release and generate formulae
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.4.6' }}
        run: |
          python3 -c 'import os; from ci.homebrew import STABLE_TAG; assert STABLE_TAG.fullmatch(os.environ["TAG"])'
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | any')" = false
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'kickstart-*-py3.14.tar.gz*' --dir archives
          python3 ci/homebrew.py --tag "$TAG" --repository "$GITHUB_REPOSITORY" --artifacts archives --output formula/kickstart.rb
          gh release download v0.4.5 --repo "$GITHUB_REPOSITORY" --pattern 'kickstart-*-py3.14.tar.gz*' --dir previous
          python3 ci/homebrew.py --tag v0.4.5 --repository "$GITHUB_REPOSITORY" --artifacts previous --output formula/previous.rb
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: formula/*.rb

  smoke:
    needs: formula
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: formula
      - name: Verify package lifecycle and upgrade from v0.4.5
        run: bash scripts/ci/smoke-homebrew.sh formula/kickstart.rb formula/previous.rb

  publish:
    if: ${{ github.repository == 'woud420/kickstart' && github.event_name != 'pull_request' }}
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require tap-scoped credential
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo '::error::Configure HOMEBREW_TAP_TOKEN with Contents read/write on woud420/homebrew-tap; rerun this workflow for the published tag.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: woud420/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: formula
      - name: Publish verified formula
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def version(path):
              match = re.search(r'/releases/download/v(\d+)\.(\d+)\.(\d+)/', path.read_text())
              if match is None:
                  raise SystemExit(f'Cannot determine stable version in {path}')
              return tuple(map(int, match.groups()))
          current = Path('tap/Formula/kickstart.rb')
          if current.exists() and version(current) > version(Path('formula/kickstart.rb')):
              raise SystemExit('Refusing to downgrade the tap to an older release')
          PY
          mkdir -p tap/Formula
          cp formula/kickstart.rb tap/Formula/kickstart.rb
          cd tap
          git push --dry-run origin HEAD:main
          if git diff --quiet -- Formula/kickstart.rb && git ls-files --error-unmatch Formula/kickstart.rb >/dev/null 2>&1; then
            echo 'Tap already contains this formula.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/kickstart.rb
          git commit -m "Update kickstart to $TAG"
          git push origin HEAD:main
