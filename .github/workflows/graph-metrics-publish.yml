name: Publish Architecture Evidence

# The chronological holdout did not support PR commentary: topology-enriched
# cases underperformed controls and graph reveal showed anchoring risk. Pull
# requests retain their source-run artifacts, while this trusted workflow
# validates and summarizes default-branch evidence only.
on:
  workflow_run:
    workflows: [Architecture Evidence]
    types: [completed]

permissions: {}

concurrency:
  group: architecture-evidence-publisher-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate hostile artifact and sanitize publication
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should-publish: ${{ steps.preflight.outputs.should-publish }}
      publish-kind: ${{ steps.preflight.outputs.publish-kind }}
      pr-number: ${{ steps.preflight.outputs.pr-number }}
      head-sha: ${{ steps.preflight.outputs.head-sha }}

    steps:
      - name: Validate workflow-run, repository, commit, PR, and artifact identity
        id: preflight
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          METADATA_PATH: ${{ runner.temp }}/architecture-evidence-run-metadata.json
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const repository = context.payload.repository;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allowedEvents = new Set(['pull_request', 'push', 'schedule', 'workflow_dispatch']);
            const shaPattern = /^[0-9a-f]{40}$/;
            if (!run || !repository || repository.id !== run.repository.id || repository.full_name !== `${owner}/${repo}`) {
              core.setFailed('Triggering run repository identity mismatch');
              return;
            }
            if (run.conclusion !== 'success' || !allowedEvents.has(run.event)) {
              core.setFailed(`Refusing event/conclusion: ${run.event}/${run.conclusion}`);
              return;
            }
            if (!shaPattern.test(run.head_sha || '') || !Number.isInteger(run.id) || !Number.isInteger(run.run_attempt)) {
              core.setFailed('Triggering run commit or run identity is invalid');
              return;
            }
            const expectedWorkflow = await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id: '.github/workflows/graph-metrics.yml',
            });
            const workflowPath = String(run.path || '');
            if (run.workflow_id !== expectedWorkflow.data.id ||
                (workflowPath !== '.github/workflows/graph-metrics.yml' &&
                 !workflowPath.startsWith('.github/workflows/graph-metrics.yml@'))) {
              core.setFailed('Triggering workflow identity mismatch');
              return;
            }
            if (run.event === 'pull_request') {
              core.notice('PR comments are disabled by the pilot holdout; use the source-run artifact.');
              core.setOutput('should-publish', 'false');
              core.setOutput('publish-kind', 'pr');
              core.setOutput('pr-number', '');
              core.setOutput('head-sha', run.head_sha);
              return;
            }
            const expectedArtifactName = `architecture-evidence-v1-run-${run.id}-attempt-${run.run_attempt}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const matches = artifacts.filter((artifact) => artifact.name === expectedArtifactName && !artifact.expired);
            if (matches.length !== 1) {
              core.setFailed(`Expected exactly one ${expectedArtifactName} artifact, found ${matches.length}`);
              return;
            }
            const artifact = matches[0];
            if (!Number.isInteger(artifact.id) || artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 52428800) {
              core.setFailed('Artifact identity or compressed size is outside policy');
              return;
            }
            if (artifact.workflow_run && artifact.workflow_run.id !== run.id) {
              core.setFailed('Artifact is not bound to the triggering workflow run');
              return;
            }

            let publishKind = 'summary';
            let prNumber = null;
            let baseSha = null;
            let headRepositoryId = run.head_repository && run.head_repository.id;
            let configurationChanged = false;
            if (!Number.isInteger(headRepositoryId)) {
              core.setFailed('Triggering head repository identity is unavailable');
              return;
            }
            if (run.event === 'pull_request') {
              publishKind = 'pr';
              const candidateNumbers = new Set(
                (Array.isArray(run.pull_requests) ? run.pull_requests : [])
                  .map((candidate) => candidate.number)
                  .filter(Number.isInteger)
              );
              if (candidateNumbers.size === 0) {
                const associated = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: run.head_sha, per_page: 100 }
                );
                for (const candidate of associated) {
                  if (Number.isInteger(candidate.number)) {
                    candidateNumbers.add(candidate.number);
                  }
                }
              }
              const verifiedCandidates = [];
              for (const candidateNumber of candidateNumbers) {
                const response = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: candidateNumber,
                });
                const candidate = response.data;
                if (candidate.base.repo.id === repository.id && candidate.base.ref === 'master' &&
                    candidate.head.repo && candidate.head.repo.id === headRepositoryId) {
                  verifiedCandidates.push(candidate);
                }
              }
              if (verifiedCandidates.length !== 1) {
                core.setFailed(`Expected exactly one verified PR identity, found ${verifiedCandidates.length}`);
                return;
              }
              const pull = verifiedCandidates[0];
              prNumber = pull.number;
              if (pull.state !== 'open') {
                core.notice('Skipping architecture evidence for a pull request that is no longer open.');
                core.setOutput('should-publish', 'false');
                core.setOutput('publish-kind', 'pr');
                core.setOutput('pr-number', String(prNumber));
                core.setOutput('head-sha', run.head_sha);
                return;
              }
              if (pull.head.sha !== run.head_sha) {
                core.notice('Skipping stale architecture evidence; the PR head has advanced.');
                core.setOutput('should-publish', 'false');
                core.setOutput('publish-kind', 'pr');
                core.setOutput('pr-number', String(prNumber));
                core.setOutput('head-sha', run.head_sha);
                return;
              }
              baseSha = pull.base.sha;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const guarded = new Set([
                '.github/graph-metrics.yml',
                '.github/behavior-evidence.yml',
                '.github/graph-metrics-requirements.lock',
                '.github/workflows/graph-metrics.yml',
                '.github/workflows/graph-metrics-publish.yml',
              ]);
              const changesEvidenceInfrastructure = (filename) =>
                typeof filename === 'string' &&
                (guarded.has(filename) || filename.startsWith('.github/scripts/'));
              configurationChanged = files.length >= 3000 || files.some((file) =>
                changesEvidenceInfrastructure(file.filename) ||
                changesEvidenceInfrastructure(file.previous_filename)
              );
            } else if (headRepositoryId !== repository.id) {
              core.setFailed('Trusted-branch run unexpectedly used a different head repository');
              return;
            } else if (run.head_branch !== 'master') {
              core.notice('Skipping summary publication for a non-default-branch dispatch.');
              core.setOutput('should-publish', 'false');
              core.setOutput('publish-kind', 'summary');
              core.setOutput('pr-number', '');
              core.setOutput('head-sha', run.head_sha);
              return;
            }

            const metadata = {
              schema_version: 'architecture-evidence-workflow-run/1.0.0',
              repository: repository.full_name,
              repository_id: repository.id,
              workflow_id: run.workflow_id,
              run_id: run.id,
              run_attempt: run.run_attempt,
              event_name: run.event,
              head_sha: run.head_sha,
              base_sha: baseSha,
              head_repository_id: headRepositoryId,
              pr_number: prNumber,
              configuration_changed: configurationChanged,
              artifact_id: artifact.id,
              artifact_name: artifact.name,
              artifact_size: artifact.size_in_bytes,
              artifact_digest: artifact.digest || null,
            };
            fs.writeFileSync(process.env.METADATA_PATH, `${JSON.stringify(metadata)}\n`, { encoding: 'utf8', mode: 0o600 });
            core.setOutput('should-publish', 'true');
            core.setOutput('publish-kind', publishKind);
            core.setOutput('pr-number', prNumber === null ? '' : String(prNumber));
            core.setOutput('head-sha', run.head_sha);
            core.setOutput('artifact-id', String(artifact.id));

      - name: Check out trusted publisher code only
        if: steps.preflight.outputs.should-publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-publisher
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/graph-metrics.yml
            .github/behavior-evidence.yml
            .github/graph-metrics-requirements.lock
          sparse-checkout-cone-mode: false

      - name: Verify trusted publisher checkout identity
        if: steps.preflight.outputs.should-publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          trusted="$GITHUB_WORKSPACE/trusted-publisher"
          test "$(git -C "$trusted" rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$trusted/.github/scripts/graph_evidence.py"
          test -f "$trusted/.github/scripts/publisher_guard.py"
          test ! -e "$trusted/src"

      - name: Set up pinned validation runtime
        if: steps.preflight.outputs.should-publish == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Download the source artifact without extracting it
        if: steps.preflight.outputs.should-publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.preflight.outputs.artifact-id }}
          path: ${{ runner.temp }}/architecture-evidence-incoming
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          skip-decompress: true
          digest-mismatch: error

      - name: Locate the single raw archive
        if: steps.preflight.outputs.should-publish == 'true'
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(find "$RUNNER_TEMP/architecture-evidence-incoming" -maxdepth 1 -type f -print0)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected one downloaded archive, found ${#archives[@]}"
            exit 1
          fi
          printf 'path=%s\n' "${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate artifact and derive sanitized Markdown
        if: steps.preflight.outputs.should-publish == 'true'
        id: validate-artifact
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        run: |
          set -euo pipefail
          trusted="$GITHUB_WORKSPACE/trusted-publisher"
          output="$RUNNER_TEMP/architecture-evidence-sanitized"
          python -I "$trusted/.github/scripts/publisher_guard.py" validate \
            --archive "$ARCHIVE_PATH" \
            --metadata "$RUNNER_TEMP/architecture-evidence-run-metadata.json" \
            --policy "$trusted/.github/graph-metrics.yml" \
            --behavior-policy "$trusted/.github/behavior-evidence.yml" \
            --dependency-lock "$trusted/.github/graph-metrics-requirements.lock" \
            --output "$output"
          echo "comment-sha256=$(sha256sum "$output/comment.md" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Write trusted-branch and weekly summary
        if: steps.preflight.outputs.should-publish == 'true' && steps.preflight.outputs.publish-kind == 'summary'
        shell: bash
        run: |
          set -euo pipefail
          sed -n '1,1200p' "$RUNNER_TEMP/architecture-evidence-sanitized/comment.md" >> "$GITHUB_STEP_SUMMARY"
